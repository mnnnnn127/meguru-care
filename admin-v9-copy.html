<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>めぐる訪問ケア｜管理画面 V9連携</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head>
<body><iframe id="adminFrame" src="admin.html" title="めぐる訪問ケア 管理画面"></iframe>
<script>
const V9='meguru-care-calendar-canva-v9-linked.html';
const f=document.getElementById('adminFrame');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    d.addEventListener('click',e=>{
      const el=e.target.closest('button,a'); if(!el)return;
      const code=(el.getAttribute('onclick')||'')+' '+(el.getAttribute('href')||'')+' '+(el.textContent||'');
      if(/reservation-v2\.html|予約ページ/.test(code)){
        e.preventDefault(); e.stopImmediatePropagation(); window.location.href=V9;
      }
    },true);
  }catch(err){console.error(err)}
});
</script></body></html>
